[package]
name = "kira_kv_engine"
version = "0.7.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "a high-performance key→id index toolkit for Rust"
repository = "https://github.com/ARyaskov/kira_kv_engine"
homepage = "https://github.com/ARyaskov/kira_kv_engine"
documentation = "https://docs.rs/kira_kv_engine"
readme = "README.md"
keywords = ["hashing", "perfect-hash", "key-value", "storage", "pgm"]
categories = ["data-structures", "database"]


[features]
default = ["parallel"]
# Parallel builds on a persistent rayon pool (P-core pinned on hybrid CPUs).
parallel = ["dep:rayon", "dep:core_affinity"]
# Legacy feature names kept so existing `features = [...]` lists keep compiling.
# They have no effect: SIMD paths are dispatched at runtime, the PGM engines are
# always compiled in, and nothing in the crate uses serde/rkyv.
serde = []
simd = []
pgm = []
avx512 = []
unsafe_optimizations = []
bbhash = []

[dependencies]
thiserror = "2"
rayon = { version = "1.11", optional = true }
core_affinity = { version = "0.8", optional = true }
wyhash = "0.6"
hashbrown = "0.16"

[dev-dependencies]
tempfile = "3"
rand = "0.8.5"

[[example]]
name = "million_build"
required-features = ["parallel"]

[[bench]]
name = "engines"
harness = false


# Profiles below apply only when building this crate's own examples, benches and
# tests; a dependent crate's profile is what governs the library code it links.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true

[profile.release-extreme]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = true
overflow-checks = false
